map $status $allowed_methods {
    405 "GET, HEAD";
    default "";
}
map $uri $asset_expiry {
    default -1;
    "~^/game/[0-9a-f]{64}/" 1y;
    ~^/assets/ 1y;
}
map $http_x_request_id $correlation_id {
    "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
    default $request_id;
}
log_format pokerlost_json escape=json
    '{"time":"$time_iso8601","level":"INFO","service_id":"pokerWeb",'
    '"environment":"$deployment_environment","request_id":"$correlation_id",'
    '"operation":"static","status":$status,"duration_seconds":$request_time}';
include /etc/nginx/pokerlost/server.conf;
