server {
    include /etc/nginx/pokerlost/environment.conf;
    root /usr/share/nginx/html;
    server_tokens off;
    expires $asset_expiry;
    client_max_body_size 1m;
    access_log /dev/stdout pokerlost_json;
    log_not_found off;
    error_log /dev/stderr crit;
    include /etc/nginx/pokerlost/headers.conf;
    include /etc/nginx/pokerlost/routes.conf;
}
