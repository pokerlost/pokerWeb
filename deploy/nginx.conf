server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /healthz { default_type text/plain; return 200 'ready\n'; }
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ^~ /realtime { return 404; }
    location ^~ /game/ { expires 1y; try_files $uri =404; }
    location ^~ /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
